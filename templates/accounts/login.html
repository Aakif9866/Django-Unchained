{% extends "base.html" %}
{% block title %}Sign in · SIDEQUEST{% endblock %}
{% block content %}
<div class="container-xl"><div class="sq-panel auth-card reveal">
  <h1 class="h3 mb-3">Sign in</h1>
  <form method="post" novalidate>{% csrf_token %}
    {% include "components/form_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-cta w-100" type="submit">Sign in</button>
  </form>
  <p class="text-muted mt-3 mb-0">New here? <a href="{% url 'accounts:register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Create an account</a></p>
</div></div>
{% endblock %}
