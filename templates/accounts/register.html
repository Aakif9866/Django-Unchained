{% extends "base.html" %}
{% block title %}Create account · SIDEQUEST{% endblock %}
{% block content %}
<div class="container-xl"><div class="sq-panel auth-card reveal">
  <h1 class="h3 mb-3">Create your account</h1>
  <form method="post" novalidate>{% csrf_token %}
    {% include "components/form_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-cta w-100" type="submit">Create account</button>
  </form>
  <p class="text-muted mt-3 mb-0">Already have one? <a href="{% url 'accounts:login' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Sign in</a></p>
</div></div>
{% endblock %}
