{% extends "base.html" %}
{% block title %}Profile · SIDEQUEST{% endblock %}
{% block content %}
<div class="container-xl"><div class="sq-panel auth-card reveal">
  <h1 class="h3 mb-1">{{ user.shown_name }}</h1>
  <p class="text-muted">@{{ user.username }} · joined {{ user.date_joined|date:"M Y" }}</p>
  <form method="post" novalidate>{% csrf_token %}
    {% include "components/form_fields.html" %}
    <button class="btn btn-cta w-100" type="submit">Save profile</button>
  </form>
  <p class="mt-3 mb-0"><a href="{% url 'accounts:password_change' %}">Change password</a></p>
</div></div>
{% endblock %}
