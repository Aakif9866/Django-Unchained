server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing — a hard refresh on
    # /notes or /testing-dashboard has no matching file on disk, so
    # fall back to index.html and let React Router take over from there.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything under /api/ and /admin/ goes to Django, not React.
    # "backend" resolves via Docker Compose's built-in service discovery
    # (the service name in docker-compose.yml becomes a DNS name on the
    # compose network) — not a hardcoded IP.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
    }
}
