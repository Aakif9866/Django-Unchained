services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Overrides for the container context, layered on top of .env:
      DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "backend,localhost"
      # Same-origin inside the compose network — nginx is the only thing
      # a browser ever talks to directly, so CORS doesn't come into play
      # for browser requests at all. Kept for direct-to-backend testing.
      CORS_ALLOWED_ORIGIN: "http://localhost:8080"
    # dashboard/views.py reads phase-2-results/dashboard-data.json via
    # settings.BASE_DIR.parent — that's the repo root in local dev, but
    # the backend image's build context is ./backend only, so nothing
    # under phase-2-results/ ever gets baked into the image. Mounted
    # read-only instead of restructuring the build context: test-result
    # data is runtime content, not something that belongs inside a
    # backend application image.
    volumes:
      - ./phase-2-results:/phase-2-results:ro
    # No "ports:" here on purpose — only nginx (via the frontend service)
    # is meant to be reachable from outside the compose network, matching
    # the target architecture (Internet -> Nginx -> Django).
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/auth/csrf/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""  # relative /api/... — see client.js and nginx.conf
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
